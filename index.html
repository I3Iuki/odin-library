<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Odin Library</title>
        
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1 id="title">MyLibrary</h1>
            <button class="button" id="add-book-btn"><img src="assets/add.svg" alt="" class="svg"> Add Book</button>
        </header>

        <main>

                
            </div>
            <dialog id="book-addition-popup" open>
                <form id="book-addition-form">
                    <button class="close"><img src="./assets/close-x.svg" class="svg close-x"></button>
                    <h3>Add Book</h3>

                    <div>
                        <label for="title-input">Title</label>
                        <input type="text" id="title-input">
                    </div>
                    
                    <div>
                        <label for="author-input">Author</label>
                        <input type="text" id="author-input" required>
                    </div>
    
                    <div>
                        <label for="cover-input">Cover Image</label>
                        <input type="file" id="cover-input">
                    </div>
    
                    <div>
                        <label for="page-input">Page Count</label>
                        <input type="number" id="page-input">
                    </div>
    
                    <div>
                        <label for="status-input">Have you finished this book?</label>
                        <input type="checkbox" id="status-input">
                    </div>
                    <button type="submit">Add Book</button>
                </form>
            </dialog>
            <dialog id="deletion-confirmation-popup" >
                <form id="deletion-confirmation-form">
                    <button class="close"><img src="./assets/close-x.svg" class="svg close-x"></button>
                    <h3>Deletion Confirmation</h3>
                    <p>You cannot undo this.</p>
                    <div>
                        <button type="button" id="cancel">Cancel</button>
                        <button type="submit" id="confirm">Yes, Delete</button>
                    </div>
                </form>
            </dialog>
        </main>

        
        <script src="script.js"></script>
    </body>
</html>
