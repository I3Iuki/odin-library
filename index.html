<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Odin Library</title>
        
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1 id="title">MyLibrary</h1>
            <button class="button" id="add-book-btn">+ Add Book</button>
        </header>

        <main>
            <div id="card-container">
                <div class="card">
                    <div class="card-header">
                        <h2 class="book-title">Jewels</h2>
                        <div class="options">
                            <img src="./assets/ellipsis.svg" alt="" class="ellipsis">
                            <ul class="options-dropdown active">
                                <li class="change-status">Change read status</li>
                                <li class="delete">Delete</li>
                            </ul>
                        </div>
                    </div>
                    <p class="author"><b>Author:</b> Danielle Steel</p>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT43K1fHKj7DUzHKageMmuwG0VEG_JxWft1i_AxwGjpqQ&s=10" alt="cover img" class="book-cover">
                    <div class="additional-info">
                        <p class="page-count"><b># of Pages:</b> 234</p>
                        <p class="status unread">Read</p>
                    </div>
                </div>
                
            </div>
            <dialog id="book-form">
                <form id="book-form">
                    <label for="title"></label>
                    <input type="text" id="title">
                    
                    <label for="title"></label>
                    <input type="text" id="title">
    
                    <label for="title"></label>
                    <input type="text" id="title">
    
                    <label for="title"></label>
                    <input type="text" id="title">
    
                    <label for="title"></label>
                    <input type="text" id="title">
    
                </form>
            </dialog>
            <dialog class="deletion-confirmation">

            </dialog>
        </main>

        
        <script src="script.js"></script>
    </body>
</html>
